<article id="details-{{id}}" hidden>
  <h2 id="detail-title-{{id}}">{{label}}</h2>
  {{{description}}}
  <dl class="entity-facts">
    <div>
      <dt>标识</dt>
      <dd><code>{{id}}</code></dd>
    </div>
    <div>
      <dt>角色</dt>
      <dd>{{role}}</dd>
    </div>
    {{{membership}}}
  </dl>
  {{{tags}}} {{{relations}}}
</article>
