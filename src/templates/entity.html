<details>
  <summary>{{label}}</summary>
  <article id="details-{{id}}" tabindex="-1">
    <header class="entity-header">
      <h2 id="detail-title-{{id}}">{{label}}</h2>
      <p class="detail-context" data-detail-context hidden></p>
    </header>
    <dl class="entity-facts">
      <div>
        <dt>标识</dt>
        <dd><code>{{id}}</code></dd>
      </div>
    </dl>
    {{{tags}}} {{{appearances}}} {{{locations}}}
  </article>
</details>
